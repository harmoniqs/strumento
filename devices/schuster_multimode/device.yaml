# Schuster "multimode" device instance (cqed pack).
#
# Topology + wiring + calibration VALUES for one physical fridge, transcribed from the v1
# multimode_expts hardware_config.yml (device.*) and its soccfg snapshot. This is the only
# instance-specific file: the pack (element types, pulse libraries, readout kind) is generic;
# the numbers below are what make "dev.qubit.ge_pi()" mean *this* qubit.
#
# Wiring (from v1 hw.soc.dacs): qubit=DAC2, sideband=DAC0, flux(low/high)=DAC1,
# manipulate=DAC3(nyq2), storage=DAC6(nyq2), readout=DAC5 + ADC0.

pack: cqed
soccfg_snapshot: soccfg_snapshot.json   # relative to this file; loaded as a plain dict

wiring:
  lines:
    qubit:
      name: qubit
      generators:
        - {role: drive,    dac_ch: 2, nyquist: 1, gen_type: full}
        - {role: sideband, dac_ch: 0, nyquist: 1, gen_type: full}
    manipulate:
      name: manipulate
      generators:
        - {role: main, dac_ch: 3, nyquist: 2, gen_type: full}
    storage:
      name: storage
      generators:
        - {role: main, dac_ch: 6, nyquist: 2, gen_type: full}
    coupler:
      name: coupler
      generators:
        - {role: low,  dac_ch: 1, nyquist: 1, band_hz: [0.0, 1.8e9]}
        - {role: high, dac_ch: 1, nyquist: 1, band_hz: [1.8e9, 1.0e12]}
  readout:
    dac_ch: 5
    adc_chs: [0]

topology:
  - {type: Transmon, name: qubit}
  - {type: BosonicMode, name: manipulate, role: manipulate, line: manipulate}
  - {type: BosonicMode, name: S1, role: storage, line: storage}
  - {type: BosonicMode, name: S2, role: storage, line: storage}
  - {type: BosonicMode, name: S3, role: storage, line: storage}
  - {type: BosonicMode, name: S4, role: storage, line: storage}
  - {type: BosonicMode, name: S5, role: storage, line: storage}
  - {type: BosonicMode, name: S6, role: storage, line: storage}
  - {type: BosonicMode, name: S7, role: storage, line: storage}
  - {type: Coupler, name: coupler}
  - {type: ReadoutResonator, name: readout}

calibration:
  qubit:
    f_ge: 3562.6105332943075
    f_ef: 3419.036012060942
    T1: 393.0070389378491
    pulses:
      pi_ge:  {gain: 3289, sigma: 0.035, length: 0.0, type: gauss}
      hpi_ge: {gain: 1629, sigma: 0.035, length: 0.0, type: gauss}
      pi_ef:  {gain: 3038, sigma: 0.035, length: 0.0, type: gauss}
  readout:
    frequency: 749.4328673317561
    gain: 800
    readout_length: 1.5
    trig_offset: 450
    relax_delay: 2500
    phase: 248.20794307836275
    threshold: -33.695816180320435
