# Quantum-dot spin instance (spin pack) — SKELETON.
#
# A minimal double-dot: one driven Dot qubit + a plunger and a barrier gate. Numbers are
# placeholders for the skeleton — real operating points and control land with the spin pulse layer.

pack: spin

wiring:
  lines:
    q0:
      name: q0
      generators:
        - {role: drive, dac_ch: 0, nyquist: 1}
    p0:
      name: p0
      generators:
        - {role: dc, dac_ch: 1, nyquist: 1}
    b0:
      name: b0
      generators:
        - {role: dc, dac_ch: 2, nyquist: 1}
  # charge-sensor readout (RF reflectometry off the ADC) — nominal wiring for the skeleton
  readout:
    dac_ch: 3
    adc_chs: [0]

topology:
  - {type: Dot, name: q0, encoding: ld}
  - {type: Plunger, name: p0}
  - {type: Barrier, name: b0}

calibration:
  dots:
    q0: {f_qubit_mhz: 5000.0, exchange_j_mhz: 50.0}
