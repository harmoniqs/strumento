# multimode_demo — a generic multimode cQED device instance (cqed pack).
#
# Topology + wiring + calibration VALUES for one (fictional) fridge: a transmon dispersively
# coupled to a "manipulate" cavity and two long-lived storage modes, with a driven coupler for
# beamsplitter swaps. This is the worked example of the config-as-data model used throughout the
# docs and tests: everything about *a specific device* lives here as data; the pack (element
# types, pulse libraries, readout kind) is generic. Calibration numbers are synthetic but
# physically plausible.
#
# Wiring: qubit=DAC2, sideband=DAC0, coupler(low/high)=DAC1, manipulate=DAC3(nyq2),
# storage=DAC6(nyq2), readout=DAC5 + ADC0.

pack: cqed
soccfg_snapshot: ../_fixtures/soccfg_v1_zcu216.json   # relative to this file; loaded as a plain dict

wiring:
  lines:
    qubit:
      name: qubit
      generators:
        - {role: drive,    dac_ch: 2, nyquist: 1, gen_type: full}
        - {role: sideband, dac_ch: 0, nyquist: 1, gen_type: full}
    manipulate:
      name: manipulate
      generators:
        - {role: main, dac_ch: 3, nyquist: 2, gen_type: full}
    storage:
      name: storage
      generators:
        - {role: main, dac_ch: 6, nyquist: 2, gen_type: full}
    coupler:
      name: coupler
      generators:
        - {role: low,  dac_ch: 1, nyquist: 1, band_hz: [0.0, 1.8e9]}
        - {role: high, dac_ch: 1, nyquist: 1, band_hz: [1.8e9, 1.0e12]}
    readout:
      name: readout
      generators:
        - {role: probe, dac_ch: 5, nyquist: 2, gen_type: full}
  readout:
    dac_ch: 5
    adc_chs: [0]

topology:
  - {type: Transmon, name: qubit}
  - {type: BosonicMode, name: manipulate, role: manipulate, line: manipulate, freq_mhz: 5200.0}
  - {type: BosonicMode, name: S1, role: storage, line: storage, freq_mhz: 6000.0}
  - {type: BosonicMode, name: S2, role: storage, line: storage, freq_mhz: 6150.0}
  - {type: Coupler, name: coupler}
  - {type: ReadoutResonator, name: readout}

# Instance-declared alias namespaces (D21): dev.sideband drives the qubit line's
# sideband generator with the multiphoton-ladder ops.
aliases:
  sideband: {element: qubit, ops: sideband}

calibration:
  qubit:
    f_ge: 4000.0
    f_ef: 3820.0
    T1: 100.0
    pulses:
      pi_ge:  {gain: 8192, sigma: 0.030, length: 0.0, type: gauss}
      hpi_ge: {gain: 4096, sigma: 0.030, length: 0.0, type: gauss}
      pi_ef:  {gain: 7600, sigma: 0.030, length: 0.0, type: gauss}
  readout:
    frequency: 750.0
    gain: 1000
    readout_length: 2.0
    trig_offset: 400
    relax_delay: 500
    phase: 0.0
    threshold: 0.0
  multiphoton:
    f0-g1:
      pi:
        - {frequency: 2100.0, gain: 12000, length: 0.8, ramp_sigma: 0.01}
        - {frequency: 2088.0, gain: 12500, length: 0.85, ramp_sigma: 0.01}
      hpi:
        - {frequency: 2100.0, gain: 12000, length: 0.4, ramp_sigma: 0.01}
  swaps:
    manipulate-S1: {frequency: 800.0,  gain: 9000, length: 2.4, ramp_sigma: 0.01}
    manipulate-S2: {frequency: 950.0,  gain: 9500, length: 2.6, ramp_sigma: 0.01}
  modes:
    manipulate:
      revival_time: [1.6, 0.8]
      displace: {gain: 6000, sigma: 0.040, type: gauss}
